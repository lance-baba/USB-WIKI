name: tests

# 触发策略（阶段划分，勿随意恢复 push.branches）
# ==========================================================================
# GitHub 在本项目里的定位是**代码备份 + 版本回退**，不是每次提交都做 Release 级验收。
#
#   普通 push main  → 不触发（只是云端备份 / commit 历史 / 出错可回退点）
#   workflow_dispatch（手动 Run workflow） → 触发完整 5 路 CI
#   push v* tag     → 触发完整 5 路 CI
#
# Full CI 的使用场合：阶段 Gate 验收 / Release Candidate / 正式 Release。
# ⚠ 不要为了「让徽章继续绿」把 push.branches 加回来 —— 那会把「备份」和
#   「发布验收」两件事混在一起，代价是每次改一行文档都要排一次完整矩阵。
# ⚠ 也不要削弱下面的 5 路矩阵内容：本策略只改**何时触发**，不改**测什么**。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    # ⚠ 不要恢复 continue-on-error。曾用它「先让徽章变绿」，代价是
    # Windows 上测试套件与冒烟测试**从未真正执行**，而工作流仍显示成功 ——
    # 等于验收仪器本身坏了。任何平台的失败都必须让 workflow 真正失败。
    #
    # 此前 Windows 失败的真实原因（2026-09-16 定位）：
    # GitHub 的 windows-latest runner 是**英文 locale（cp1252）**，而内联 Python
    # 脚本向非 UTF-8 流打印中文会抛 UnicodeEncodeError。当时只有「启动冒烟」
    # 步骤单独设了编码变量，其余步骤没有 —— 于是「环境自检」先炸，
    # 后续步骤全部被跳过。
    # 修法：在 **job 级**统一注入编码变量，新增步骤也自动继承，
    # 不再依赖每个内联脚本各自记得设置。
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    strategy:
      fail-fast: false          # 一个平台挂了也要看其它平台的结果
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-release.lock

      - name: 安装依赖（release lock，可复现验证）
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-release.lock

      # 环境自检：确认测试确实是在「干净环境」下跑的
      # （无嵌入式 runtime、无 onnxruntime），否则「降级链」相关断言等于没测
      - name: 环境自检
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util, sys
          print("Python:", sys.version.split()[0])
          for mod in ("trafilatura", "lxml", "sqlite_vec", "yaml", "pdfminer", "pypdf"):
              print(f"  {mod:12} {'OK' if importlib.util.find_spec(mod) else 'MISSING'}")
          onnx = importlib.util.find_spec("onnxruntime") is not None
          print(f"  onnxruntime  {'存在（非预期）' if onnx else '缺失（预期：用于验证降级链）'}")
          PY

      - name: 运行测试套件
        shell: bash
        # ⚠ bash -e 会在 python 失败时立刻退出，rc 与 cat 都执行不到，
        # 于是「测试失败时 CI 只能看到 exit 1，看不到任何诊断」——
        # 这正是此前定位困难的原因。必须先关掉 -e 再恢复。
        run: |
          set +e
          python -u tests/test_suite.py > test-out.txt 2>&1
          rc=$?
          set -e
          cat test-out.txt
          exit "$rc"

      - name: 启动冒烟（服务能否真正起来并响应）
        shell: bash
        # 编码变量已由 job 级 env 统一注入，此处不再单独设置
        run: |
          python - <<'PY'
          import json, os, subprocess, sys, time, urllib.request
          for _s in (sys.stdout, sys.stderr):
              try: _s.reconfigure(encoding="utf-8", errors="replace")
              except Exception: pass
          env = {**os.environ, "PYTHONUTF8": "1", "PYTHONIOENCODING": "utf-8"}
          proc = subprocess.Popen(
              [sys.executable, "app/launcher.py", "--no-browser", "--port", "28901"],
              env=env, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
          )
          try:
              ok = False
              for _ in range(40):
                  time.sleep(1)
                  try:
                      with urllib.request.urlopen("http://127.0.0.1:28901/healthz", timeout=3) as r:
                          if json.loads(r.read()).get("ok"):
                              ok = True
                              break
                  except Exception:
                      pass
              if not ok:
                  raise SystemExit("服务未能在 40s 内就绪")
              with urllib.request.urlopen("http://127.0.0.1:28901/api/import/formats", timeout=10) as r:
                  caps = json.loads(r.read())["data"]
              print("支持扩展名:", len(caps["exts"]), "| PDF 后端:", caps["pdf_backend"])
              print("SMOKE OK")
          finally:
              proc.terminate()
              try:
                  proc.wait(timeout=15)
              except subprocess.TimeoutExpired:
                  proc.kill()
          PY

  # ==========================================================================
  # 第二条强制验收链：**产品真实形态**
  #
  # 上面的 test job 跑的是 GitHub runner 的系统 Python + pip 安装依赖，
  # 只能证明「开发环境兼容」。而我们真正交付给用户的是
  # **Windows 自包含嵌入式运行时**（runtime/python-3.11-embed）。
  #
  # 两者必须都绿：系统 Python CI = 开发兼容性，Portable CI = 产品兼容性。
  # 任何一条红了都不许往下开发。
  # ==========================================================================
  windows-portable-smoke:
    name: windows-latest / Portable Runtime
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      # 这个 Python 只用来**运行构建脚本本身**；被测的是它构建出来的运行时。
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 构建 Windows 自包含运行时
        shell: bash
        # --no-mirror：构建脚本默认走清华镜像（给国内用户），
        # 在 GitHub runner 上反而可能超时。
        # 不加 --with-onnx：默认发布形态不含 onnxruntime（体积翻倍且缺模型时无用）。
        run: python setup_runtime_windows.py --no-mirror

      - name: 运行时体检
        shell: bash
        run: runtime/python-3.11-embed/python.exe setup_runtime_windows.py --check

    # A4.2b Stage Gate：取件 pinned embedding 资源（字节不进 Git，vendor/cache/ 已忽略）
    # 用维护者侧契约 resources/embedding/default.json，pin 死 revision 逐文件 SHA256 校验，
    # 绝不从 main/latest 拉取。取不到则后续严格构建的 EMBEDDING_* 门禁会失败。
      - name: 获取 pinned embedding 资源（取件 + SHA256 校验）
        shell: bash
        run: |
          set +e
          python scripts/fetch_embedding_resource.py > fetch-out.txt 2>&1
          rc=$?
          set -e
          cat fetch-out.txt
          echo "embedding fetch rc=$rc"
          exit "$rc"

      - name: 用嵌入式 Python 跑测试套件（这才是产品形态）
        shell: bash
        run: |
          set +e
          runtime/python-3.11-embed/python.exe -u tests/test_suite.py > portable-out.txt 2>&1
          rc=$?
          set -e
          grep -aE "TOTAL=|通过 .* 项" portable-out.txt || true
          cat portable-out.txt
          exit "$rc"

    # A4.2b Stage Gate：严格发布构建（fresh embedded runtime 由当前 lock 构建 →
    # RUNTIME_LOCK_MISMATCH=0 / LOCK_ENTRY_MISSING=0）。取件已完成，资源会被本地拷贝进
    # payload/embedding，绝不联网。任一门禁失败即非零退出（_fail_build → SystemExit(1)）。
      - name: 严格发布构建 + A4.2b Stage Gate（build_release.py --strict）
        shell: bash
        run: |
          set +e
          runtime/python-3.11-embed/python.exe scripts/build_release.py --strict --output dist/a42b-strict > strict-out.txt 2>&1
          rc=$?
          set -e
          cat strict-out.txt
          echo "=== A4.2b Stage Gate 证据 ==="
          echo "RUNTIME_LOCK_MISMATCH count : $(grep -ac 'RUNTIME_LOCK_MISMATCH' strict-out.txt || true)"
          echo "LOCK_ENTRY_MISSING count    : $(grep -ac 'LOCK_ENTRY_MISSING' strict-out.txt || true)"
          grep -a "介质自校验" strict-out.txt || true
          if grep -aq "GATE FAILED" strict-out.txt; then
            echo "STRICT GATE FAILED"; exit 1
          fi
          echo "build_release.py --strict rc=$rc"
          exit "$rc"

      - name: 用嵌入式 Python 启动冒烟
        shell: bash
        run: |
          python - <<'PY'
          import http.client, json, os, subprocess, sys, time

          # 被测进程用嵌入式运行时；本脚本用 runner 的 Python 做驱动
          exe = os.path.join("runtime", "python-3.11-embed", "python.exe")
          if not os.path.exists(exe):
              raise SystemExit(f"嵌入式运行时不存在: {exe}")

          env = {**os.environ, "PYTHONUTF8": "1", "PYTHONIOENCODING": "utf-8"}
          # ⚠ 不要用 subprocess.PIPE：没人读管道时，子进程日志写满 64KB 系统缓冲
          # 就会阻塞在 write 上，表现为「优雅退出永远等不到」。
          # 上一版就是这么超时的 —— 重定向到文件，既没有缓冲问题，失败时还能看日志。
          logf = open("portable-smoke.log", "wb")
          proc = subprocess.Popen(
              [exe, "app/launcher.py", "--no-browser", "--port", "28902"],
              env=env, stdout=logf, stderr=subprocess.STDOUT,
          )
          ok = False
          try:
              for _ in range(60):
                  time.sleep(1)
                  try:
                      c = http.client.HTTPConnection("127.0.0.1", 28902, timeout=3)
                      c.request("GET", "/healthz", headers={"Host": "127.0.0.1:28902"})
                      r = c.getresponse()
                      body = r.read()
                      c.close()
                      if r.status == 200 and json.loads(body).get("ok"):
                          ok = True
                          break
                  except Exception:
                      pass
              if not ok:
                  raise SystemExit("嵌入式运行时未能在 60s 内就绪")

              # ⚠ 等**初始化真正完成**再继续。
              # `/healthz` 一响应就代表「端口起来了」，但后台的 boot 线程可能还在
              # 解析嵌入源 —— 此时发退出请求会撞上仍在初始化的上下文。
              # （实测到：那种情况下 boot 线程会抛 'NoneType' object has no
              # attribute 'embedder'，且**进程此后不退出**。那是一个独立的产品
              # 竞态缺陷，记为待修；本冒烟测的是「就绪后的优雅退出」，故先等到 ready。）
              ready = False
              for _ in range(90):
                  try:
                      c = http.client.HTTPConnection("127.0.0.1", 28902, timeout=3)
                      c.request("GET", "/api/status", headers={"Host": "127.0.0.1:28902"})
                      r = c.getresponse()
                      st = json.loads(r.read()).get("data") or {}
                      c.close()
                      if st.get("ready"):
                          ready = True
                          break
                  except Exception:
                      pass
                  time.sleep(1)
              if not ready:
                  raise SystemExit("初始化未在 90s 内完成（ready 仍为 false）")
              print("初始化完成（ready=true）")

              # ⚠ 等**初始化真正完成**再继续。
              # `/healthz` 一响应就代表「端口起来了」，但后台的 boot 线程可能还在
              # 解析嵌入源 —— 此时发退出请求会撞上仍在初始化的上下文。
              # （实测到：那种情况下 boot 线程会抛 'NoneType' object has no
              # attribute 'embedder'，且**进程此后不退出**。那是一个独立的产品
              # 竞态缺陷，记为待修；本冒烟测的是「就绪后的优雅退出」，故先等到 ready。）
              ready = False
              for _ in range(90):
                  try:
                      c = http.client.HTTPConnection("127.0.0.1", 28902, timeout=3)
                      c.request("GET", "/api/status", headers={"Host": "127.0.0.1:28902"})
                      r = c.getresponse()
                      st = json.loads(r.read()).get("data") or {}
                      c.close()
                      if st.get("ready"):
                          ready = True
                          break
                  except Exception:
                      pass
                  time.sleep(1)
              if not ready:
                  raise SystemExit("初始化未在 90s 内完成（ready 仍为 false）")
              print("初始化完成（ready=true）")

              # 一个核心 API（能力清单）
              c = http.client.HTTPConnection("127.0.0.1", 28902, timeout=10)
              c.request("GET", "/api/import/formats", headers={"Host": "127.0.0.1:28902"})
              r = c.getresponse()
              caps = json.loads(r.read())["data"]
              c.close()
              print("支持扩展名:", len(caps["exts"]), "| PDF 后端:", caps["pdf_backend"])

              # 优雅退出
              c = http.client.HTTPConnection("127.0.0.1", 28902, timeout=10)
              c.request("POST", "/api/system/shutdown", headers={
                  "Host": "127.0.0.1:28902", "Content-Type": "application/json"}, body="{}")
              c.getresponse().read()
              c.close()

              try:
                  proc.wait(timeout=90)
              except subprocess.TimeoutExpired:
                  logf.flush()
                  print("=== 进程未在 90s 内退出，末尾日志 ===")
                  print(open("portable-smoke.log", encoding="utf-8", errors="replace")
                        .read()[-2500:])
                  raise SystemExit("优雅退出超时（服务未退出）")
              if proc.returncode != 0:
                  raise SystemExit(f"优雅退出返回码异常: {proc.returncode}")
              print("进程已退出，返回码 0")

              # 端口必须已释放
              time.sleep(1)
              probe = subprocess.run([exe, "-c",
                  "import socket;s=socket.socket();"
                  "s.settimeout(2);"
                  "\nprint('PORT_FREE' if s.connect_ex(('127.0.0.1',28902))!=0 else 'PORT_STILL_BUSY')"],
                  env=env, capture_output=True, text=True)
              print(probe.stdout.strip() or probe.stderr.strip())
              print("PORTABLE SMOKE OK")
          finally:
              if proc.poll() is None:
                  proc.terminate()
                  try:
                      proc.wait(timeout=15)
                  except subprocess.TimeoutExpired:
                      proc.kill()
          PY
