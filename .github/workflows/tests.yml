name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false          # 一个平台挂了也要看其它平台的结果
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 环境自检：确认测试确实是在「干净环境」下跑的
      # （无嵌入式 runtime、无 onnxruntime），否则「降级链」相关断言等于没测
      - name: 环境自检
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util, sys
          print("Python:", sys.version.split()[0])
          for mod in ("trafilatura", "lxml", "sqlite_vec", "yaml", "pdfminer", "pypdf"):
              print(f"  {mod:12} {'OK' if importlib.util.find_spec(mod) else 'MISSING'}")
          onnx = importlib.util.find_spec("onnxruntime") is not None
          print(f"  onnxruntime  {'存在（非预期）' if onnx else '缺失（预期：用于验证降级链）'}")
          PY

      # 下面三步是一个整体：测试步骤不因失败中断 job，诊断步骤把输出尾部打成
      # 注解（公开仓库的 Actions 日志下载需要鉴权，运行摘要页只给一句退出码），
      # 最后一步才把 job 标记为失败。
      - name: 运行测试套件
        id: tests
        shell: bash
        continue-on-error: true
        run: |
          python -u tests/test_suite.py > test-out.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat test-out.txt

      - name: 失败诊断（输出尾部）
        if: steps.tests.outputs.exit_code != '0'
        shell: bash
        run: |
          tail_txt=$(tail -n 45 test-out.txt | tr '\n' '|' | tr -d '\r' | sed 's/%/%25/g')
          echo "::error title=测试失败(exit ${{ steps.tests.outputs.exit_code }}) 输出尾部::$tail_txt"

      - name: 标记测试结果
        if: steps.tests.outputs.exit_code != '0'
        shell: bash
        run: |
          echo "测试套件以 exit ${{ steps.tests.outputs.exit_code }} 结束"
          exit 1

      # 无论成败都把诊断写进运行摘要 —— 公开仓库的 Actions 日志下载需要鉴权，
      # 而摘要页无需登录即可查看，是唯一可靠的排查通道（对无 token 的排查者亦然）。
      - name: 诊断写入运行摘要
        if: always()
        shell: bash
        run: |
          {
            echo "### 测试诊断 · ${{ matrix.os }} / Python ${{ matrix.python }}"
            echo ""
            echo "- 测试退出码：\`${{ steps.tests.outputs.exit_code }}\`"
            echo ""
            echo '```text'
            tail -n 60 test-out.txt 2>/dev/null || echo "(test-out.txt 不存在)"
            echo '```'

            # 输出为空说明进程在导入阶段就死了（那时还没进入 main 的异常兜底）
            if [ ! -s test-out.txt ]; then
              echo ""
              echo "#### 输出为空 —— 执行导入探针"
              echo ""
              echo '```text'
              python - <<'PROBE' 2>&1
              import sys, traceback
              try:
                  sys.stdout.reconfigure(encoding="utf-8", errors="replace")
              except Exception:
                  pass
              mods = ["app.core.paths", "app.core.log_util", "app.core.config", "app.core.net_util",
                      "app.core.db", "app.core.embedder", "app.core.chunker", "app.core.search",
                      "app.core.crawler", "app.core.llm", "app.core.indexer", "app.core.sync",
                      "app.core.graph", "app.core.converters"]
              for m in mods:
                  try:
                      __import__(m)
                      print("OK  ", m)
                  except BaseException as e:
                      print("FAIL", m, "->", type(e).__name__, e)
                      traceback.print_exc()
                      break
              import sqlite3
              print("sqlite3", sqlite3.sqlite_version, "fts5:",
                    bool(sqlite3.connect(":memory:").execute(
                        "select 1 from pragma_compile_options where compile_options like '%FTS5%'").fetchone()))
              try:
                  import sqlite_vec
                  c = sqlite3.connect(":memory:")
                  c.enable_load_extension(True)
                  sqlite_vec.load(c)
                  print("sqlite_vec load OK")
              except BaseException as e:
                  print("sqlite_vec FAIL ->", type(e).__name__, e)
                  traceback.print_exc()
              PROBE
              echo '```'
            fi

            echo ""
            echo "<details><summary>环境</summary>"
            echo ""
            echo '```text'
            python -c "import sys,locale,platform;print('python',sys.version);print('platform',platform.platform());print('preferred_encoding',locale.getpreferredencoding());print('stdout_encoding',sys.stdout.encoding);print('fs_encoding',sys.getfilesystemencoding())" 2>&1 || true
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 启动冒烟（服务能否真正起来并响应）
        shell: bash
        env:
          PYTHONUTF8: "1"          # 内联脚本不导入应用模块，需自行保证输出编码
          PYTHONIOENCODING: utf-8
        run: |
          python - <<'PY'
          import json, os, subprocess, sys, time, urllib.request
          for _s in (sys.stdout, sys.stderr):
              try: _s.reconfigure(encoding="utf-8", errors="replace")
              except Exception: pass
          env = {**os.environ, "PYTHONUTF8": "1", "PYTHONIOENCODING": "utf-8"}
          proc = subprocess.Popen(
              [sys.executable, "app/launcher.py", "--no-browser", "--port", "28901"],
              env=env, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
          )
          try:
              ok = False
              for _ in range(40):
                  time.sleep(1)
                  try:
                      with urllib.request.urlopen("http://127.0.0.1:28901/healthz", timeout=3) as r:
                          if json.loads(r.read()).get("ok"):
                              ok = True
                              break
                  except Exception:
                      pass
              if not ok:
                  raise SystemExit("服务未能在 40s 内就绪")
              with urllib.request.urlopen("http://127.0.0.1:28901/api/import/formats", timeout=10) as r:
                  caps = json.loads(r.read())["data"]
              print("支持扩展名:", len(caps["exts"]), "| PDF 后端:", caps["pdf_backend"])
              print("SMOKE OK")
          finally:
              proc.terminate()
              try:
                  proc.wait(timeout=15)
              except subprocess.TimeoutExpired:
                  proc.kill()
          PY
