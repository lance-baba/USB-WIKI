name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false          # 一个平台挂了也要看其它平台的结果
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 环境自检：确认测试确实是在「干净环境」下跑的
      # （无嵌入式 runtime、无 onnxruntime），否则「降级链」相关断言等于没测
      - name: 环境自检
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util, sys
          print("Python:", sys.version.split()[0])
          for mod in ("trafilatura", "lxml", "sqlite_vec", "yaml", "pdfminer", "pypdf"):
              print(f"  {mod:12} {'OK' if importlib.util.find_spec(mod) else 'MISSING'}")
          onnx = importlib.util.find_spec("onnxruntime") is not None
          print(f"  onnxruntime  {'存在（非预期）' if onnx else '缺失（预期：用于验证降级链）'}")
          PY

      # 下面三步是一个整体：测试步骤不因失败中断 job，诊断步骤把输出尾部打成
      # 注解（公开仓库的 Actions 日志下载需要鉴权，运行摘要页只给一句退出码），
      # 最后一步才把 job 标记为失败。
      - name: 运行测试套件
        id: tests
        shell: bash
        continue-on-error: true
        run: |
          python -u tests/test_suite.py > test-out.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat test-out.txt

      - name: 失败诊断（输出尾部）
        if: steps.tests.outputs.exit_code != '0'
        shell: bash
        run: |
          tail_txt=$(tail -n 45 test-out.txt | tr '\n' '|' | tr -d '\r' | sed 's/%/%25/g')
          echo "::error title=测试失败(exit ${{ steps.tests.outputs.exit_code }}) 输出尾部::$tail_txt"

      - name: 标记测试结果
        if: steps.tests.outputs.exit_code != '0'
        shell: bash
        run: |
          echo "测试套件以 exit ${{ steps.tests.outputs.exit_code }} 结束"
          exit 1

      # 无论成败都把诊断写进运行摘要 —— 公开仓库的 Actions 日志下载需要鉴权，
      # 而摘要页无需登录即可查看，是唯一可靠的排查通道（对无 token 的排查者亦然）。
      # 无论成败都把诊断写进运行摘要 —— 公开仓库的 Actions 日志下载需要鉴权，
      # 而摘要页无需登录即可查看。（注意：别在 { } 分组里再嵌 heredoc，会解析失败）
      - name: 诊断写入运行摘要
        if: always()
        shell: bash
        run: |
          S="$GITHUB_STEP_SUMMARY"
          echo "### 测试诊断 · ${{ matrix.os }} / Python ${{ matrix.python }}" >> "$S"
          echo "" >> "$S"
          echo "- 测试退出码：\`${{ steps.tests.outputs.exit_code }}\`" >> "$S"
          echo "" >> "$S"
          echo '```text' >> "$S"
          if [ -s test-out.txt ]; then
            tail -n 60 test-out.txt >> "$S"
          else
            echo "(test-out.txt 为空或不存在 —— 进程可能在导入阶段就已死亡)" >> "$S"
          fi
          echo '```' >> "$S"
          echo "" >> "$S"
          echo "#### 运行环境" >> "$S"
          echo "" >> "$S"
          echo '```text' >> "$S"
          python -c "import sys,locale,platform;print('python            ',sys.version.split()[0]);print('platform          ',platform.platform());print('preferred_encoding',locale.getpreferredencoding());print('stdout_encoding   ',sys.stdout.encoding);print('fs_encoding       ',sys.getfilesystemencoding())" >> "$S" 2>&1 || true
          echo '```' >> "$S"

      - name: 启动冒烟（服务能否真正起来并响应）
        shell: bash
        env:
          PYTHONUTF8: "1"          # 内联脚本不导入应用模块，需自行保证输出编码
          PYTHONIOENCODING: utf-8
        run: |
          python - <<'PY'
          import json, os, subprocess, sys, time, urllib.request
          for _s in (sys.stdout, sys.stderr):
              try: _s.reconfigure(encoding="utf-8", errors="replace")
              except Exception: pass
          env = {**os.environ, "PYTHONUTF8": "1", "PYTHONIOENCODING": "utf-8"}
          proc = subprocess.Popen(
              [sys.executable, "app/launcher.py", "--no-browser", "--port", "28901"],
              env=env, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
          )
          try:
              ok = False
              for _ in range(40):
                  time.sleep(1)
                  try:
                      with urllib.request.urlopen("http://127.0.0.1:28901/healthz", timeout=3) as r:
                          if json.loads(r.read()).get("ok"):
                              ok = True
                              break
                  except Exception:
                      pass
              if not ok:
                  raise SystemExit("服务未能在 40s 内就绪")
              with urllib.request.urlopen("http://127.0.0.1:28901/api/import/formats", timeout=10) as r:
                  caps = json.loads(r.read())["data"]
              print("支持扩展名:", len(caps["exts"]), "| PDF 后端:", caps["pdf_backend"])
              print("SMOKE OK")
          finally:
              proc.terminate()
              try:
                  proc.wait(timeout=15)
              except subprocess.TimeoutExpired:
                  proc.kill()
          PY
